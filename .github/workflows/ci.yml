name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Tests mock the database and S3. These values only need to be present so
      # config and provider-chain assertions can run; no external request is
      # made. Live database integration tests are skipped in CI.
      CI_SKIP_DB_TESTS: "1"
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/lawbite
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      GITHUB_CLIENT_ID: ci-github-client-id
      GITHUB_CLIENT_SECRET: ci-github-client-secret
      TAVILY_API_KEY: ci-tavily-api-key
      INCEPTION_API_KEY: ci-inception-api-key
      NVIDIA_API_KEY: ci-nvidia-api-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm run audit

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    env:
      # Build-time placeholders only. No job in this workflow connects to a
      # database, an AI provider, or S3.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/lawbite
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: ci-google-client-id
      GOOGLE_CLIENT_SECRET: ci-google-client-secret
      GITHUB_CLIENT_ID: ci-github-client-id
      GITHUB_CLIENT_SECRET: ci-github-client-secret
      TAVILY_API_KEY: ci-tavily-api-key
      INCEPTION_API_KEY: ci-inception-api-key
      NVIDIA_API_KEY: ci-nvidia-api-key
      AWS_REGION: ap-south-1
      AWS_ACCESS_KEY_ID: ci-aws-access-key
      AWS_SECRET_ACCESS_KEY: ci-aws-secret-key
      S3_BUCKET_NAME: ci-bucket
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
